# This workflow publishes the Python package to PyPI when a release is created
# Uses PyPI Trusted Publishing - no API token needed
#
# SETUP REQUIRED (one-time):
# 1. Go to the existing project's Publishing settings:
#    https://pypi.org/manage/project/py-did-multiplegt-dyn/settings/publishing/
# 2. Add a GitHub Actions trusted publisher with:
#    - Owner: Credible-Answers
#    - Repository name: py_did_multiplegt_dyn
#    - Workflow name: publish.yml
#    - Environment name: pypi

name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Check dependency consistency
        run: python -m pip check

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/set_release_version.py "$RELEASE_TAG"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[release]"

      - name: Clean old builds
        run: |
          rm -rf dist/ build/ src/*.egg-info *.egg-info
          find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name '*.egg-info' -exec rm -rf {} + 2>/dev/null || true

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Verify build artifacts
        run: |
          echo "Built packages:"
          ls -la dist/
          echo ""
          echo "Package count: $(ls dist/ | wc -l)"
          # Ensure only 2 files (wheel + sdist) are present
          if [ $(ls dist/ | wc -l) -ne 2 ]; then
            echo "ERROR: Expected exactly 2 files in dist/"
            exit 1
          fi
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -f "dist/py_did_multiplegt_dyn-${PACKAGE_VERSION}-py3-none-any.whl"
          test -f "dist/py_did_multiplegt_dyn-${PACKAGE_VERSION}.tar.gz"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # IMPORTANT: this permission is mandatory for trusted publishing
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/py_did_multiplegt_dyn

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify downloaded artifacts
        run: |
          echo "Downloaded packages:"
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
